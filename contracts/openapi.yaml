openapi: 3.0.3
info:
  title: Daily News & Weather API Contract
  description: Executable contract specification between Flutter Frontend and Backend Services
  version: 1.0.0
servers:
  - url: https://api.open-meteo.com
    description: Open-Meteo Weather Service
  - url: https://geocoding-api.open-meteo.com
    description: Open-Meteo Geocoding Service
  - url: https://daily-news-weather-portal-default-rtdb.asia-southeast1.firebasedatabase.app
    description: Firebase Realtime Database

paths:
  /v1/forecast:
    get:
      summary: Fetch weather forecast by latitude and longitude
      parameters:
        - name: latitude
          in: query
          required: true
          schema:
            type: number
            format: double
        - name: longitude
          in: query
          required: true
          schema:
            type: number
            format: double
        - name: current
          in: query
          required: true
          schema:
            type: string
        - name: hourly
          in: query
          required: false
          schema:
            type: string
        - name: daily
          in: query
          required: false
          schema:
            type: string
        - name: timezone
          in: query
          required: false
          schema:
            type: string
        - name: forecast_days
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Successful weather payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeatherResponse'

  /v1/search:
    get:
      summary: Search cities and geographic coordinates
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
        - name: count
          in: query
          required: false
          schema:
            type: integer
        - name: language
          in: query
          required: false
          schema:
            type: string
        - name: format
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Search results list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeocodingResponse'

  /articles.json:
    get:
      summary: Fetch all published backend articles from Firebase RTDB
      responses:
        '200':
          description: Key-value map of articles
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/ArticleItem'
    post:
      summary: Publish a new article
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleItem'
      responses:
        '200':
          description: Article successfully created
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string

  /users/{uid}/notifications.json:
    get:
      summary: Fetch user notifications
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Notification map
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/NotificationItem'

components:
  schemas:
    WeatherResponse:
      type: object
      required:
        - current
        - daily
      properties:
        current:
          type: object
          required:
            - temperature_2m
            - apparent_temperature
            - relative_humidity_2m
            - wind_speed_10m
            - weather_code
          properties:
            temperature_2m:
              type: number
            apparent_temperature:
              type: number
            relative_humidity_2m:
              type: integer
            wind_speed_10m:
              type: number
            weather_code:
              type: integer
        hourly:
          type: object
          properties:
            time:
              type: array
              items:
                type: string
            temperature_2m:
              type: array
              items:
                type: number
            weather_code:
              type: array
              items:
                type: integer
        daily:
          type: object
          required:
            - time
            - temperature_2m_max
            - temperature_2m_min
            - weather_code
          properties:
            time:
              type: array
              items:
                type: string
            temperature_2m_max:
              type: array
              items:
                type: number
            temperature_2m_min:
              type: array
              items:
                type: number
            weather_code:
              type: array
              items:
                type: integer

    GeocodingResponse:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            required:
              - name
              - latitude
              - longitude
            properties:
              name:
                type: string
              latitude:
                type: number
              longitude:
                type: number
              admin1:
                type: string
              country:
                type: string

    ArticleItem:
      type: object
      required:
        - title
        - link
        - description
        - source
      properties:
        title:
          type: string
        link:
          type: string
        description:
          type: string
        imageUrl:
          type: string
          nullable: true
        source:
          type: string
        publishedAt:
          type: string
          nullable: true
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        inlineImageUrls:
          type: array
          items:
            type: string

    NotificationItem:
      type: object
      required:
        - title
        - body
        - type
        - createdAt
        - isRead
      properties:
        title:
          type: string
        body:
          type: string
        type:
          type: string
        createdAt:
          type: string
        isRead:
          type: boolean
