name: daily_news_weather_portal
description: "Đề tài 5: Ứng dụng đọc tin tức, thời tiết & tin tức tổng hợp - Daily News & Weather Portal"
publish_to: 'none'
version: 1.3.3+7

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  xml: ^6.5.0
  intl: ^0.19.0
  webview_flutter: ^4.8.0
  cached_network_image: ^3.3.1
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_database: ^11.1.4
  google_sign_in: ^6.2.2
  geolocator: ^14.1.2
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.jpg
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
